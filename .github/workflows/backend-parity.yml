# The dense-versus-sparse gate, on every push.
#
# What keeps the sparse storage from silently rotting is that two binaries built from the same
# sources, differing only in which storage the aliases in src/storages/storage_backend.h select,
# produce byte-identical output from the same seed. tests/backend_parity/run.sh is the whole of the
# check; this file exists to run it.
#
# The scale is a pair of trees with eight and six leaves and a few hundred iterations, which takes
# under a second per chain -- the build is what costs, which is why it runs in debug mode: less to
# compile than -O3, and the assertions are live.
name: backend parity

# `push` alone, not `push` plus `pull_request`: the two events carry different refs, so a same-repo
# pull request would run this twice, and neither run would cancel the other.
on:
  push:

permissions:
  contents: read

concurrency:
  group: backend-parity-${{ github.ref }}
  cancel-in-progress: true

# `shell: bash` rather than the default `bash -e`, so that a pipeline in the step below fails on
# the first command that fails rather than on the last one.
defaults:
  run:
    shell: bash

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACOL_MODE: debug
    steps:
      - uses: actions/checkout@v4

      # setup-pixi installs pixi, then the environment pixi.toml describes, and caches it keyed on
      # pixi.lock. A stale hit cannot happen: changing a dependency changes the lock file.
      - name: Install pixi and the build environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Dense and sparse must agree byte for byte
        run: pixi run parity
