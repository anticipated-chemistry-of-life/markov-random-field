# acol -- build/run helpers.
#
#   pixi install                       create or update the build environment
#   pixi run build    [PRESET]         configure + compile build/PRESET/acol
#   pixi run simulate [PRESET] -- ARGS build, then run acol simulate ARGS
#   pixi run infer    [PRESET] -- ARGS build, then run acol infer ARGS
#   pixi run run      [PRESET] -- ARGS build, then run acol ARGS
#   pixi run test     [PRESET] -- ARGS build, then run acol_unitTests ARGS
#
# PRESET is a preset from CMakePresets.json, named <mode>-<sources>, and it
# decides everything about the build:
#
#   mode     debug (no optimisation, assertions on), release (-O3), or profile
#            (release, writing a CPU profile of the whole run to
#            <out>_profile.prof; src/profiling.h)
#   sources  the data sources compiled in, spelled in l, s, m order: l, s, ls,
#            lm, sm or lsm. l is LOTUS, s the simple error model and m mass
#            spec; one of l and s is required.
#
# It defaults to debug-ls, and to debug-lsm for `test`, so that the tests cover
# the mass spec code too. Its build directory is build/<preset>, so switching
# between presets does not force a rebuild. Everything after `--` goes to the
# executable verbatim:
#
#     pixi run run release-lsm -- --input file.txt --scalar 0.6
#
# is `acol --input file.txt --scalar 0.6` compiled at -O3 with all three data
# sources.
#
# Which storage backs the field, and which backs the node state, are not build
# arguments. They are two aliases in src/storages/storage_backend.h, edited by
# hand. `pixi run parity` is the one build that overrides them, and it drives
# cmake itself.
#
# `configure` runs once per directory: pixi repeats it when CMakeLists.txt, the
# presets or the toolchain file change, and skips it otherwise, because
# re-running cmake makes FetchContent check coretools and stattools again.
#
# Which compiler a build uses is decided in cmake/toolchain.cmake, which the
# presets name.
#
# A task runs inside the environment below, so there is nothing to activate by
# hand. `pixi shell` opens a shell in it. `pixi task list` lists every task.

[workspace]
name = "acol"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

# git is deliberately not in here: FetchContent uses the system git, which you
# already need to have cloned this repository.
[dependencies]
cmake = ">=3.30"
ninja = "*"
cxx-compiler = "*"
zlib = "*"
fmt = "*"
armadillo = "*"
openssl = "*"
nlohmann_json = "*"
libopenblas = { version = "*", build = "*openmp*" }
# gperftools' CPU profiler, which the `profile` mode links (ACOL_PROFILING).
gperftools = "*"

# On Linux the conda gcc brings its own libgomp; forcing llvm-openmp there would
# flip _openmp_mutex to the llvm variant and break it.
[target.osx.dependencies]
llvm-openmp = "*"

[tasks.configure]
args = [{ arg = "preset", default = "debug-ls" }]
cmd = "cmake --preset {{ preset }}"
inputs = ["CMakeLists.txt", "CMakePresets.json", "cmake/*.cmake"]
outputs = ["build/{{ preset }}/CMakeCache.txt"]
description = "Configure build/<preset> without compiling anything."

# .clangd points at build/compile_commands.json; keep it on the directory last
# asked for.
[tasks._select]
args = [{ arg = "preset", default = "debug-ls" }]
depends-on = [{ task = "configure", args = ["{{ preset }}"] }]
cmd = "ln -sfn {{ preset }}/compile_commands.json build/compile_commands.json"

[tasks.build]
args = [{ arg = "preset", default = "debug-ls" }]
depends-on = [{ task = "_select", args = ["{{ preset }}"] }]
cmd = "cmake --build --preset {{ preset }} --target acol"
description = "Compile build/<preset>/acol."

[tasks.run]
args = [{ arg = "preset", default = "debug-ls" }]
depends-on = [{ task = "build", args = ["{{ preset }}"] }]
cmd = "./build/{{ preset }}/acol"
description = "Compile acol and run it with the arguments after `--`."

# The two things acol does. `pixi run run` is the same binary without a task
# name in front, for the runs that name neither.
[tasks.simulate]
args = [{ arg = "preset", default = "debug-ls" }]
depends-on = [{ task = "build", args = ["{{ preset }}"] }]
cmd = "./build/{{ preset }}/acol simulate"
description = "Compile acol and draw a data set with it (arguments after `--`)."

[tasks.infer]
args = [{ arg = "preset", default = "debug-ls" }]
depends-on = [{ task = "build", args = ["{{ preset }}"] }]
cmd = "./build/{{ preset }}/acol infer"
description = "Compile acol and run a chain with it (arguments after `--`)."

[tasks.test]
args = [{ arg = "preset", default = "debug-lsm" }]
depends-on = [{ task = "_select", args = ["{{ preset }}"] }]
cmd = "cmake --build --preset {{ preset }} --target acol_unitTests && ./build/{{ preset }}/acol_unitTests"
description = "Compile and run the unit tests (arguments after `--` go to gtest)."

# Always a release build: a debug benchmark measures the assertions. The data
# sources do not reach it, so it takes the default ones.
[tasks.bench]
depends-on = [{ task = "configure", args = ["release-ls"] }]
cmd = "cmake --build --preset release-ls --target acol_dense_bench && ./build/release-ls/acol_dense_bench"
description = "Benchmark the dense storages against armadillo (arguments after `--`; `-- --help`)."

[tasks.parity]
cmd = "bash tests/backend_parity/run.sh"
description = "Build both storage backends and check they produce byte-identical output."

[tasks.clean]
cmd = "rm -rf build"
description = "Delete every build directory."

[tasks.distclean]
cmd = "rm -rf coretools stattools"
depends-on = ["clean"]
description = "Delete build directories *and* the fetched coretools/stattools checkouts."
