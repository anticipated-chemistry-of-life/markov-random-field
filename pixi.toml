# acol -- build/run helpers.
#
#   pixi install                         create or update the build environment
#   pixi run build [MODE] [FLAGS]        configure + compile ./acol
#   pixi run run   [MODE] [FLAGS] -- ARGS   build, then run ./acol ARGS
#   pixi run test  [MODE] [FLAGS] -- ARGS   build, then run ./acol_unitTests ARGS
#
# MODE  is `debug` (the default) or `release`.
# FLAGS is any combination of the letters below; it defaults to `ls`.
#
#     l -> -DLOTUS=ON        (LOTUS data)
#     s -> -DSIMPLE_DATA=ON  (simple error model data)
#     m -> -DUSE_MS_DATA=ON  (mass spec data)
#
# Everything after `--` goes to the executable verbatim:
#
#     pixi run run release lsm -- --input file.txt --scalar 0.6
#
# is `./acol --input file.txt --scalar 0.6` compiled at -O3 with all three data
# sources. MODE and FLAGS are positional and both take their default when left
# out, so `pixi run run -- --input file.txt` is a debug `ls` build.
#
# Which storage backs the field, and which backs the node state, are not build
# arguments. They are two aliases in src/storages/storage_backend.h, edited by
# hand. `pixi run parity` is the one build that overrides them, and it drives
# cmake itself.
#
# Every combination of MODE and FLAGS gets its own build directory
# (build/<MODE>-<FLAGS>), so switching back and forth does not force a rebuild.
# `configure` runs once per directory: pixi repeats it when CMakeLists.txt, the
# presets or the toolchain file change, and skips it otherwise, because
# re-running cmake regenerates armadillo's headers and that invalidates every
# object including them.
#
# Which compiler a build uses is decided in cmake/toolchain.cmake, which the
# presets name.
#
# A task runs inside the environment below, so there is nothing to activate by
# hand. `pixi shell` opens a shell in it. `pixi task list` lists every task.

[workspace]
name = "acol"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

# git is deliberately not in here: FetchContent uses the system git, which you
# already need to have cloned this repository.
[dependencies]
cmake = ">=3.30"
ninja = "*"
cxx-compiler = "*"
zlib = "*"
fmt = "*"
armadillo = "*"
openssl = "*"
nlohmann_json = "*"
libopenblas = { version = "*", build = "*openmp*" }

# On Linux the conda gcc brings its own libgomp; forcing llvm-openmp there would
# flip _openmp_mutex to the llvm variant and break it.
[target.osx.dependencies]
llvm-openmp = "*"

# The build directory of a MODE/FLAGS pair. The letters are put back in a fixed
# order, so `sl` and `ls` name one directory. ACOL_FLAG_SUFFIX is also what
# binaryDir in CMakePresets.json reads.
[tasks.configure]
args = [
  { arg = "mode", default = "debug", choices = ["debug", "release"] },
  { arg = "flags", default = "ls" },
]
env = { ACOL_FLAG_SUFFIX = "-{{ 'l' if 'l' in flags else '' }}{{ 's' if 's' in flags else '' }}{{ 'm' if 'm' in flags else '' }}" }
cmd = "cmake --preset {{ mode }} -DLOTUS={{ 'ON' if 'l' in flags else 'OFF' }} -DSIMPLE_DATA={{ 'ON' if 's' in flags else 'OFF' }} -DUSE_MS_DATA={{ 'ON' if 'm' in flags else 'OFF' }}"
inputs = ["CMakeLists.txt", "CMakePresets.json", "cmake/*.cmake"]
outputs = [
  "build/{{ mode }}-{{ 'l' if 'l' in flags else '' }}{{ 's' if 's' in flags else '' }}{{ 'm' if 'm' in flags else '' }}/CMakeCache.txt",
]
description = "Configure the build directory without compiling anything."

# .clangd points at build/compile_commands.json; keep it on the directory last
# asked for.
[tasks._compile_commands]
args = [
  { arg = "mode", default = "debug", choices = ["debug", "release"] },
  { arg = "flags", default = "ls" },
]
depends-on = [{ task = "configure", args = ["{{ mode }}", "{{ flags }}"] }]
env = { ACOL_FLAG_SUFFIX = "-{{ 'l' if 'l' in flags else '' }}{{ 's' if 's' in flags else '' }}{{ 'm' if 'm' in flags else '' }}" }
cmd = "ln -sfn {{ mode }}$ACOL_FLAG_SUFFIX/compile_commands.json build/compile_commands.json"

[tasks.build]
args = [
  { arg = "mode", default = "debug", choices = ["debug", "release"] },
  { arg = "flags", default = "ls" },
]
depends-on = [{ task = "_compile_commands", args = ["{{ mode }}", "{{ flags }}"] }]
env = { ACOL_FLAG_SUFFIX = "-{{ 'l' if 'l' in flags else '' }}{{ 's' if 's' in flags else '' }}{{ 'm' if 'm' in flags else '' }}" }
cmd = "cmake --build build/{{ mode }}$ACOL_FLAG_SUFFIX --target acol"
description = "Compile ./acol."

[tasks.run]
args = [
  { arg = "mode", default = "debug", choices = ["debug", "release"] },
  { arg = "flags", default = "ls" },
]
depends-on = [{ task = "build", args = ["{{ mode }}", "{{ flags }}"] }]
env = { ACOL_FLAG_SUFFIX = "-{{ 'l' if 'l' in flags else '' }}{{ 's' if 's' in flags else '' }}{{ 'm' if 'm' in flags else '' }}" }
cmd = "./build/{{ mode }}$ACOL_FLAG_SUFFIX/acol"
description = "Compile ./acol and run it with the arguments after `--`."

[tasks.test]
args = [
  { arg = "mode", default = "debug", choices = ["debug", "release"] },
  { arg = "flags", default = "ls" },
]
depends-on = [{ task = "_compile_commands", args = ["{{ mode }}", "{{ flags }}"] }]
env = { ACOL_FLAG_SUFFIX = "-{{ 'l' if 'l' in flags else '' }}{{ 's' if 's' in flags else '' }}{{ 'm' if 'm' in flags else '' }}" }
cmd = "cmake --build build/{{ mode }}$ACOL_FLAG_SUFFIX --target acol_unitTests && ./build/{{ mode }}$ACOL_FLAG_SUFFIX/acol_unitTests"
description = "Compile and run the unit tests (arguments after `--` go to gtest)."

[tasks.bin]
args = [
  { arg = "mode", default = "debug", choices = ["debug", "release"] },
  { arg = "flags", default = "ls" },
]
env = { ACOL_FLAG_SUFFIX = "-{{ 'l' if 'l' in flags else '' }}{{ 's' if 's' in flags else '' }}{{ 'm' if 'm' in flags else '' }}" }
cmd = "echo build/{{ mode }}$ACOL_FLAG_SUFFIX/acol"
description = "Print the path of the acol binary for a given MODE/FLAGS."

[tasks.dir]
args = [
  { arg = "mode", default = "debug", choices = ["debug", "release"] },
  { arg = "flags", default = "ls" },
]
env = { ACOL_FLAG_SUFFIX = "-{{ 'l' if 'l' in flags else '' }}{{ 's' if 's' in flags else '' }}{{ 'm' if 'm' in flags else '' }}" }
cmd = "echo build/{{ mode }}$ACOL_FLAG_SUFFIX"
description = "Print the build directory for a given MODE/FLAGS."

[tasks.parity]
cmd = "bash tests/backend_parity/run.sh"
description = "Build both storage backends and check they produce byte-identical output."

[tasks.clean]
cmd = "rm -rf build"
description = "Delete every build directory."

[tasks.distclean]
cmd = "rm -rf coretools stattools"
depends-on = ["clean"]
description = "Delete build directories *and* the fetched coretools/stattools checkouts."
